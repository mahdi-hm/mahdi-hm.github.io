baseURL: https://mahdi-hm.github.io/
locale: en-us
title: Mahdi's Notes
theme: PaperMod
enableRobotsTXT: true
buildDrafts: false

pagination:
  pagerSize: 10

params:
  env: production
  description: "Reliable AI and engineering in the age of agents."
  author: Mahdi
  ShowReadingTime: true
  ShowPostNavLinks: true
  ShowCodeCopyButtons: true
  ShowToc: true
  homeInfoParams:
    Title: "Hi, I'm Mahdi 👋"
    Content: >
      Engineering manager writing about reliable AI, verification, and how
      software teams work now that agents write much of the code.
      Views are my own.
  socialIcons:
    - name: github
      url: https://github.com/mahdi-hm
    - name: rss
      url: /index.xml

menu:
  main:
    - name: Posts
      url: /posts/
      weight: 10
    - name: Tags
      url: /tags/
      weight: 20
    - name: About
      url: /about/
      weight: 30

markup:
  highlight:
    noClasses: false
    lineNos: false
